deptrac:
  paths:
    - src
  # Layer-dependency contract (default-deny): an edge not listed in the ruleset
  # fails analysis. Adding a layer tightens; adding a ruleset edge loosens and is
  # the human's edit only. See docs/architecture/enforcement-edits.md.
  layers:
    - name: Root
      collectors:
        - type: classLike
          value: ^Firehed\\PhpLsp\\Server$
    - name: Cache
      collectors:
        - { type: directory, value: src/Cache/.* }
    - name: Capability
      collectors:
        - { type: directory, value: src/Capability/.* }
    - name: Client
      collectors:
        - { type: directory, value: src/Client/.* }
    - name: Completion
      collectors:
        - { type: directory, value: src/Completion/.* }
    - name: Document
      collectors:
        - { type: directory, value: src/Document/.* }
    - name: Domain
      collectors:
        - { type: directory, value: src/Domain/.* }
    - name: Handler
      collectors:
        - { type: directory, value: src/Handler/.* }
    - name: Knowledge
      collectors:
        - { type: directory, value: src/Knowledge/.* }
    - name: Parser
      collectors:
        - { type: directory, value: src/Parser/.* }
    - name: Protocol
      collectors:
        - { type: directory, value: src/Protocol/.* }
    - name: Repository
      collectors:
        - { type: directory, value: src/Repository/.* }
    - name: Resolution
      collectors:
        - { type: directory, value: src/Resolution/.* }
    - name: Transport
      collectors:
        - { type: directory, value: src/Transport/.* }
  ruleset:
    Root:
      - Cache
      - Capability
      - Client
      - Completion
      - Document
      - Domain
      - Handler
      - Knowledge
      - Parser
      - Protocol
      - Repository
      - Resolution
      - Transport
    Handler:
      - Cache # InvalidatableInterface: watched-file changes and close-after-edit drop cached on-disk state
      - Capability
      - Completion
      - Document
      - Domain
      - Knowledge # write path only (SymbolSinkInterface); the SymbolSourceInterface read-side ban is held by the PHPStan rules
      - Protocol
      - Resolution
    Completion:
      - Capability
      - Document
      - Domain
      - Knowledge
      - Protocol
      - Resolution
    Resolution:
      - Document
      - Domain
      - Knowledge
      - Parser
      - Repository
    Knowledge:
      - Cache
      - Document
      - Domain
      - Parser
      - Repository
    Repository:
      - Document # FileUri, the path/URI conversion authority
      - Domain
      - Knowledge
    Parser:
      - Document
    Document:
      - Protocol
    Capability:
      - Client
      - Protocol
    Client:
      - Protocol
      - Transport
    Transport:
      - Protocol

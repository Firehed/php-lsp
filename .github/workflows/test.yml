name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.4', '8.5', '8.6']
    name: Unit Tests - ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: pcov
          ini-values: zend.assertions=1

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Install fixture dependencies
        run: composer install --prefer-dist --no-progress --working-dir=tests/Fixtures

      - name: Run unit tests with coverage
        run: composer coverage
          --
          --coverage-clover coverage.xml
          --log-junit junit-unit.xml

      - name: Run end-to-end tests
        if: ${{ !cancelled() }}
        run: composer e2e
          --
          --log-junit junit-e2e.xml

      - name: Upload coverage reports to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          disable_search: true

      - name: Upload test reports to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: junit-unit.xml,junit-e2e.xml
          disable_search: true

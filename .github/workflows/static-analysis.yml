name: Static Analysis

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  phpstan:
    runs-on: ubuntu-latest
    name: PHPStan
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: pcov

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: PHPStan
        run: composer phpstan -- --error-format=github

  baseline-shrink:
    runs-on: ubuntu-latest
    name: Baselines shrink or hold
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # bin/check-baseline-shrink reads origin/main via `git show`

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}

      - name: Check baselines
        run: php bin/check-baseline-shrink

  deptrac:
    runs-on: ubuntu-latest
    name: Deptrac
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Deptrac
        run: composer deptrac -- -f github-actions

      - name: Every class is in a layer
        run: composer layer-coverage
